name: Publish to MCP Registry

on:
  push:
    tags: ["v*"] # Triggers on version tags like v0.1.0
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for GitHub OIDC auth to the MCP Registry
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      ### Publish the MCP server metadata. This server is remote-only --
      ### the hosted endpoint in server.json is the artifact, so there is
      ### no package publish step.

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Sync version in server.json with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
