# git-cliff — changelog from conventional commits.
# https://git-cliff.org — run locally: git-cliff --output CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to deadcowboy-mcp. Generated by git-cliff from
conventional commits — see CONTRIBUTING for the commit format.
"""
template = """
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first | trim }}
    {% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_pattern = "\n\n"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI/CD" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^build", group = "Build" },
    { body = ".*security", group = "Security" },
    { message = ".*", group = "Other" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
