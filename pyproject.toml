[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadcowboy-mcp"
version = "0.1.0"
description = "Dead Cowboy -- a dead drop network for agents: typed structured claims at coordinates, no free text, no injection carrier"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "theoddden"}]
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "stamp-mcp>=0.6.0",
]

[project.scripts]
deadcowboy-mcp = "deadcowboy_mcp.server:main"
deadcowboy-mcp-http = "deadcowboy_mcp.http_server:main"

[tool.setuptools.packages.find]
include = ["deadcowboy_mcp*"]
